# Singapore — reference config (Latin script / English)
# ocr_engine is derived automatically: script_type=latin → tesseract
# Loaded + validated by src/config/economy_config.py [Z1-1.2]
economy_name: Singapore
iso_code: SG
un_name: "Singapore"
script_type: latin
languages: [en]
portals:
  - name: Singapore Statutes Online
    url: https://sso.agc.gov.sg
    type: primary
    # Strategy: browser-like headers bypass SSO's 403 bot-block (plain httpx → 403, headers → 200)
    anti_bot: header_spoof
    # Discover acts from the server-rendered in-force browse indexes (not the JS search SPA)
    discovery: index
    index_urls:
      - "https://sso.agc.gov.sg/Browse/Act/Current/All?PageSize=500&SortBy=Title&SortOrder=ASC"
      - "https://sso.agc.gov.sg/Browse/SL/Current/All?PageSize=500&SortBy=Title&SortOrder=ASC"
    # SSO act/subsidiary-legislation links live under /Act/ and /SL/ paths
    index_link_pattern: ["/Act/", "/SL/"]
    # Fetch the COMPLETE act as SSO's JS-rendered "whole document" HTML view.
    # The default act page paginates (only early sections + the arrangement-of-
    # sections TOC load) and the ?ViewType=Pdf endpoint now returns an empty 202
    # (async PDF gen behind anti-bot); ?WholeDoc=1 renders the full operative text
    # with per-section #pr<n>- anchors, so no OCR and KNOWN anchor-matching works.
    fetch: html_wholedoc
    pdf_view_suffix: "?WholeDoc=1"
    # Escalate to stealth Playwright if header_spoof / plain fetch is blocked (202)
    transport_fallback: playwright_stealth
  - name: Personal Data Protection Commission
    # Regulator guidance/advisory pages (PDPA overview, data-protection obligations,
    # advisory-guideline PDFs). It's a JS SPA with no crawlable HTML browse index,
    # but publishes a standard sitemap.xml (advertised in robots.txt) — the reliable
    # discovery path. sitemap → extract <loc> URLs → shared BM25 rank/exclude/tag.
    url: https://www.pdpc.gov.sg
    type: secondary
    # Plain httpx already returns 200 (no bot block) — no header spoof needed.
    anti_bot: none
    discovery: sitemap
    sitemap_url: https://www.pdpc.gov.sg/sitemap.xml
    # HTML pages are JS-rendered SPAs whose stripped body is <200 chars (verified
    # 2026-07-03): 42–95 chars raw vs 4206 after Playwright render. classify_render
    # mis-reads them as SSR, so `auto` would skip rendering — html_js renders every
    # HTML page unconditionally. PDF advisory guidelines are unaffected (PDF path).
    fetch: html_js
  - name: Singapore Government Gazette
    url: https://www.egazette.gov.sg
    type: secondary
    anti_bot: none
    # Discovery and fetch strategy TBD — implemented after SSO is verified
    discovery: TBD
    fetch: TBD
llm_override: null   # uses global 7-tier cascade from .env
