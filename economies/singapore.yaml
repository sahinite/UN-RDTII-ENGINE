# Singapore — reference config (Latin script / English)
# ocr_engine is derived automatically: script_type=latin → tesseract
# Loaded + validated by src/config/economy_config.py [Z1-1.2]
economy_name: Singapore
iso_code: SG
un_name: "Singapore"
script_type: latin
languages: [en]
portals:
  - name: Singapore Statutes Online
    url: https://sso.agc.gov.sg
    type: primary
    # Strategy: browser-like headers bypass SSO's 403 bot-block (plain httpx → 403, headers → 200)
    anti_bot: header_spoof
    # Discover acts from the server-rendered in-force browse indexes (not the JS search SPA)
    discovery: index
    index_urls:
      - "https://sso.agc.gov.sg/Browse/Act/Current/All?PageSize=500&SortBy=Title&SortOrder=ASC"
      - "https://sso.agc.gov.sg/Browse/SL/Current/All?PageSize=500&SortBy=Title&SortOrder=ASC"
    # Fetch complete act text via the PDF print endpoint (text-layer PDF, no OCR needed)
    fetch: pdf_endpoint
    pdf_view_suffix: "?ViewType=Pdf"
    # Escalate to stealth Playwright only if header_spoof is also blocked
    transport_fallback: playwright_stealth
  - name: Singapore Government Gazette
    url: https://www.egazette.gov.sg
    type: secondary
    anti_bot: none
    # Discovery and fetch strategy TBD — implemented after SSO is verified
    discovery: TBD
    fetch: TBD
llm_override: null   # uses global 5-tier cascade from .env
